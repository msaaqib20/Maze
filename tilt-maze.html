<!doctype html>
<html lang="en">

<title>Orbit · Tilt Maze</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none;background:#080e1b;color:#eaf4ff;font-family:system-ui,-apple-system,sans-serif}body{height:100dvh;user-select:none;-webkit-user-select:none}button,select{font:inherit;color:inherit}button{border:1px solid #31415a;background:#172337;border-radius:14px;min-height:42px;padding:9px 15px;cursor:pointer}button:active{transform:scale(.97)}button:focus-visible,select:focus-visible{outline:2px solid #6ee7dd;outline-offset:3px}button:disabled{opacity:.45}.app{height:100%;max-width:560px;margin:auto;padding:max(12px,env(safe-area-inset-top)) 16px max(10px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}header{display:flex;align-items:center;justify-content:space-between}.brand{font-weight:850;letter-spacing:.2em;font-size:22px}.eyebrow{font-size:10px;letter-spacing:.2em;color:#8c9eb8;text-transform:uppercase;margin-top:4px}.stats{display:flex;gap:24px}.stat small{display:block;font-size:10px;color:#8c9eb8;letter-spacing:.1em;margin-bottom:3px}.stat b{font-size:20px;font-variant-numeric:tabular-nums}.board{position:relative;flex:1;min-height:100px;border:1px solid #27354c;border-radius:22px;overflow:hidden;background:#0e1828;box-shadow:0 16px 60px #0005}canvas{display:block;width:100%;height:100%}.board-label{position:absolute;left:14px;top:12px;font-size:10px;letter-spacing:.16em;color:#8fa7c2;pointer-events:none}.controls{display:flex;align-items:center;justify-content:space-between;gap:12px}.hint{font-size:12px;color:#99abc3;line-height:1.6;flex:1}.hint strong{color:#77e5da;font-weight:600}.joystick{width:104px;height:104px;flex:0 0 104px;border:1px solid #31435d;border-radius:50%;background:radial-gradient(circle,#1a2c43,#0e1828);position:relative;touch-action:none}.joystick:before,.joystick:after{content:'';position:absolute;background:#34445c;opacity:.6}.joystick:before{width:1px;heig <body>
<main class="app">
<header><div><div class="brand">ORBIT<span style="color:#8bf2dd">.</span></div><div class="eyebrow">A little balance goes a long way</div></div><div class="stats"><div class="stat"><small>LEVEL</small><b id="level">01</b></div><div class="stat"><small>TIME</small><b id="time">0:00.0</b></div></div></header>
<section class="board" aria-label="Maze game"><canvas id="canvas" aria-label="Roll the glowing ball to the green exit"></canvas><div class="board-label" id="boardLabel">FIND YOUR BALANCE</div><div class="overlay" id="overlay"><div class="card" id="card"></div></div></section>
<section class="controls"><div class="hint" id="hint"><strong>Tilt. Roll. Escape.</strong><br>Find the mint exit. Avoid the dark holes.<br>Drag the stick anytime to take control.</div><div id="joystick" class="joystick" role="group" aria-label="Virtual joystick; drag to move the ball"><div class="knob" id="knob"></div></div></section>
<div class="actions"><button id="calibrate">◎ Calibrate</button><button id="mode">Use joystick</button><button id="pause">Ⅱ Pause</button></div>
<footer><span id="record">BEST —</span><button id="reset">Reset progress</button></footer>
</main>
<script>
'use strict';
// World units are maze tiles, independent of screen size and device pixel ratio.
const $=id=>document.getElementById(id), canvas=$('canvas'), ctx=canvas.getContext('2d');
const KEY='orbit-tilt-maze-v1', R=.19, MAX_SPEED=3.8, ACCEL=10, DRAG=2.5, BOUNCE=.22;
let progress={highest:1,best:{}},storageOK=true;
try{const p=JSON.parse(localStorage.getItem(KEY));if(p&&Number.isInteger(p.highest)&&p.highest>=1&&p.highest<=500){progress.highest=p.highest;for(const [k,v] of Object.entries(p.best||{}))if(Number.isFinite(v)&&v>0)progress.best[k]=v;}}catch(e){storageOK=false;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(progress));}catch(e){storageOK=false;}}
let level=progress.highest,grid=[],size=0,holes=[],ball={x:1.5,y:1.5,vx:0,vy:0},exit={x:0,y:0},elapsed=0,phase='menu',beforePause='playing',sink=0,sinkAt=null;
let mode='joystick',sensorSeen=false,raw={x:0,y:0},neutral={x:0,y:0},filtered={x:0,y:0},autoNeutral=true,lastSensor=0;
let joystick={x:0,y:0},pointer=null,keys=new Set(),width=0,height=0,lastFrame=0,accumulator=0,motionTimer=0,attempt=0,raf=0;
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const time=t=>`${Math.floor(t/60)}:${(t%60).toFixed(1).padStart(4,'0')}`;
function record(){ $('record').textContent=`BEST ${progress.best[level]?time(progress.best[level]):'—'} · UNLOCKED ${progress.highest}${storageOK?'':' · SAVING UNAVAILABLE'}`; }
function generate(l){
 const n=l+4;size=n*2+1;grid=Array.from({length:size},()=>new Uint8Array(size).fill(1));
 const stack=[[1,1]];grid[1][1]=0;
 while(stack.length){const [x,y]=stack[stack.length-1],options=[];for(const [dx,dy] of [[2,0],[-2,0],[0,2],[0,-2]]){const a=x+dx,b=y+dy;if(a>0&&b>0&&a<size-1&&b<size-1&&grid[b][a])options.push([a,b,dx,dy]);}if(!options.length){stack.pop();continue;}const [a,b,dx,dy]=options[Math.floor(Math.random()*options.length)];grid[y+dy/2][x+dx/2]=0;grid[b][a]=0;stack.push([a,b]);}
 exit={x:size-1.5,y:size-1.5};holes=[];
 // Keep traps off the unique start-to-exit route, so every maze is solvable.
 const parents=new Map([['1,1',null]]),queue=[[1,1]];
 for(let i=0;i<queue.length;i++){const [x,y]=queue[i];for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const a=x+dx,b=y+dy,k=a+','+b;if(grid[b]?.[a]===0&&!parents.has(k)){parents.set(k,x+','+y);queue.push([a,b]);}}}
 const route=new Set();let k=(size-2)+','+(size-2);while(k!==null){route.add(k);k=parents.get(k);}
 if(l>=3){const candidates=queue.filter(([x,y])=>x%2&&y%2&&!route.has(x+','+y)&&(x+y>5));for(let i=candidates.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[candidates[i],candidates[j]]=[candidates[j],candidates[i]];}holes=candidates.slice(0,Math.min(l-1,candidates.length)).map(([x,y])=>({x:x+.5,y:y+.5}));
 // In the rare case of a maze with no branches, place an avoidable offset trap.
 if(!holes.length){const [x,y]=queue.find(([x,y])=>x%2&&y%2&&x+y>5&&!(x===size-2&&y===size-2))||[3,3];holes.push({x:x+.75,y:y+.5});}}
}
function resetBall(){ball={x:1.5,y:1.5,vx:0,vy:0};sink=0;}
function loadLevel(l){level=l;generate(l);resetBall();elapsed=0;accumulator=0;$('level').textContent=String(l).padStart(2,'0');$('time').textContent=time(0);$('boardLabel').textContent=`${l+4} × ${l+4} MAZE${holes.length?' · WATCH FOR HOLES':''}`;record();}
function setMode(m){mode=m;filtered={x:0,y:0};ball.vx=ball.vy=0;$('mode').textContent=m==='tilt'?'Use joystick':'Try tilt';$('calibrate').disabled=m!=='tilt';$('hint').innerHTML=m==='tilt'?'<strong>Tilt controls active</strong><br>Hold comfortably, then tap Calibrate.<br>Drag the stick to override tilt.':'<strong>Joystick controls active</strong><br>Drag the mint stick to roll.<br>Keyboard: arrows or WASD.';}
function orientation(e){if(!Number.isFinite(e.beta)||!Number.isFinite(e.gamma))return;const a=(screen.orientation?.angle??window.orientation??0)*Math.PI/180;raw={x:e.gamma*Math.cos(a)+e.beta*Math.sin(a),y:e.beta*Math.cos(a)-e.gamma*Math.sin(a)};sensorSeen=true;lastSensor=performance.now();if(autoNeutral){neutral={...raw};autoNeutral=false;}}
window.addEventListener('deviceorientation',orientation);
async function requestMotion(){
 const token=++attempt;clearTimeout(motionTimer);autoNeutral=true;
 try{if(!window.isSecureContext||!window.DeviceOrientationEvent){setMode('joystick');return;}if(typeof DeviceOrientationEvent.requestPermission==='function'){const permission=await DeviceOrientationEvent.requestPermission();if(token!==attempt)return;if(permission!=='granted'){setMode('joystick');return;}}if(token!==attempt)return;setMode('tilt');motionTimer=setTimeout(()=>{if(token===attempt&&(!sensorSeen||performance.now()-lastSensor>2000))setMode('joystick');},1800);}catch(e){if(token===attempt)setMode('joystick');}
}
function clearInput(){joystick={x:0,y:0};pointer=null;keys.clear();$('knob').style.transform='';filtered={x:0,y:0};}
function show(html){$('card').innerHTML=html;$('overlay').hidden=false;}
function hide(){$('overlay').hidden=true;lastFrame=0;accumulator=0;}
function menu(){phase='menu';show(`<div class="orb"></div><div class="eyebrow">THE TILT MAZE</div><h1>Find your balance.</h1><p>Roll into the glowing exit.<br>Small tilts. Smooth moves. A new maze every time.</p><select id="levelSelect" aria-label="Choose unlocked level">${Array.from({length:progress.highest},(_,i)=>`<option value="${i+1}" ${i+1===level?'selected':''}>Level ${i+1}${progress.best[i+1]?' · best '+time(progress.best[i+1]):''}</option>`).join('')}</select><button class="primary" id="start">Start</button><div class="status">Motion permission is optional. A joystick is always ready.</div>`);$('start').onclick=()=>{const selected=Number($('levelSelect').value);requestMotion();loadLevel(selected);phase='playing';hide();};}
function pause(){if(phase!=='playing'&&phase!=='sinking')return;beforePause=phase;phase='paused';clearInput();show('<div class="eyebrow">TAKE A BREATH</div><h1>Paused.</h1><p>Your ball and timer are right where you left them.</p><button class="primary" id="resume">Resume</button>');$('resume').onclick=()=>{phase=beforePause;ball.vx=ball.vy=0;hide();};}
function complete(){phase='complete';ball.vx=ball.vy=0;clearInput();const previous=progress.best[level];progress.best[level]=Math.min(previous||Infinity,elapsed);progress.highest=Math.max(progress.highest,level+1);save();record();show(`<div class="orb"></div><div class="eyebrow">LEVEL ${level} COMPLETE</div><h1>${!previous||elapsed<previous?'A new personal best.':'Beautiful balance.'}</h1><div class="result"><div><small>YOUR TIME</small><b>${time(elapsed)}</b></div><div><small>LEVEL BEST</small><b>${time(progress.best[level])}</b></div></div><button class="primary" id="next">Next level →</button><button class="secondary" id="replay">Replay level · new maze</button><div class="status">${storageOK?'Progress saved on this device.':'Storage unavailable; progress lasts this session.'}</div>`);$('next').onclick=()=>{loadLevel(level+1);phase='playing';hide();};$('replay').onclick=()=>{loadLevel(level);phase='playing';hide();};}
function solid(x,y){return grid[y]?.[x]!==0;}
// Sweeping each axis in tiny steps prevents tunneling. At each wall rectangle,
// use the circle's true cross-section on the perpendicular axis (rounded corners).
function moveAxis(axis,delta){if(!delta)return;const other=axis==='x'?'y':'x',vel=axis==='x'?'vx':'vy',old=ball[axis];let target=old+delta;
 const minX=Math.floor(Math.min(ball.x,axis==='x'?target:ball.x)-R),maxX=Math.floor(Math.max(ball.x,axis==='x'?target:ball.x)+R);
 const minY=Math.floor(Math.min(ball.y,axis==='y'?target:ball.y)-R),maxY=Math.floor(Math.max(ball.y,axis==='y'?target:ball.y)+R);
 let hit=false;
 for(let y=minY;y<=maxY;y++)for(let x=minX;x<=maxX;x++){if(!solid(x,y))continue;const lo=axis==='x'?x:y,perp=axis==='x'?y:x;const d=ball[other]-clamp(ball[other],perp,perp+1);if(Math.abs(d)>=R)continue;const reach=Math.sqrt(R*R-d*d),near=lo-reach,far=lo+1+reach;
 if(delta>0&&old<=near+1e-8&&target>near){target=Math.min(target,near);hit=true;}else if(delta<0&&old>=far-1e-8&&target<far){target=Math.max(target,far);hit=true;}}
 ball[axis]=target;if(hit)ball[vel]=-ball[vel]*BOUNCE;
}
function input(){if(pointer!==null)return joystick;if(keys.size)return{x:(keys.has('arrowright')||keys.has('d')?1:0)-(keys.has('arrowleft')||keys.has('a')?1:0),y:(keys.has('arrowdown')||keys.has('s')?1:0)-(keys.has('arrowup')||keys.has('w')?1:0)};if(mode==='tilt'&&performance.now()-lastSensor<1500)return{x:clamp((raw.x-neutral.x)/22,-1,1),y:clamp((raw.y-neutral.y)/22,-1,1)};return{x:0,y:0};}
function physics(dt){elapsed+=dt;if(phase==='sinking'){sink+=dt;if(sink>=.55){resetBall();phase='playing';}return;}const v=input(),smooth=1-Math.exp(-14*dt);filtered.x+=(v.x-filtered.x)*smooth;filtered.y+=(v.y-filtered.y)*smooth;
 ball.vx=(ball.vx+filtered.x*ACCEL*dt)*Math.exp(-DRAG*dt);ball.vy=(ball.vy+filtered.y*ACCEL*dt)*Math.exp(-DRAG*dt);const speed=Math.hypot(ball.vx,ball.vy);if(speed>MAX_SPEED){ball.vx*=MAX_SPEED/speed;ball.vy*=MAX_SPEED/speed;}
 const steps=Math.max(1,Math.ceil(Math.hypot(ball.vx,ball.vy)*dt/(R*.35))),h=dt/steps;
 for(let i=0;i<steps;i++){moveAxis('x',ball.vx*h);moveAxis('y',ball.vy*h);for(const hole of holes)if(Math.hypot(ball.x-hole.x,ball.y-hole.y)<.19){phase='sinking';sink=0;sinkAt={...hole};ball.vx=ball.vy=0;return;}if(Math.hypot(ball.x-exit.x,ball.y-exit.y)<.30){complete();return;}}
}
function resize(){const r=canvas.getBoundingClientRect();width=r.width;height=r.height;const dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);}
function draw(){ctx.clearRect(0,0,width,height);if(!size)return;const pad=24,scale=Math.min((width-pad)/Math.min(size,23),(height-pad)/Math.min(size,27));const viewW=(width-pad)/scale,viewH=(height-pad)/scale;
 const cx=size<=viewW?size/2:clamp(ball.x,viewW/2,size-viewW/2),cy=size<=viewH?size/2:clamp(ball.y,viewH/2,size-viewH/2),ox=width/2-cx*scale,oy=height/2-cy*scale;
 ctx.save();ctx.translate(ox,oy);ctx.scale(scale,scale);ctx.fillStyle='#101e30';ctx.fillRect(0,0,size,size);
 const x0=Math.max(0,Math.floor(cx-viewW/2)-1),x1=Math.min(size,Math.ceil(cx+viewW/2)+1),y0=Math.max(0,Math.floor(cy-viewH/2)-1),y1=Math.min(size,Math.ceil(cy+viewH/2)+1);
 ctx.fillStyle='#2b4057';for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++)if(grid[y][x])ctx.fillRect(x,y,1,1);
 const circle=(x,y,r,color)=>{ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();};
 circle(1.5,1.5,.28,'#264a59');circle(1.5,1.5,.08,'#6b8e9b');
 for(const h of holes){circle(h.x,h.y,.36,'#765269');circle(h.x,h.y,.30,'#050913');circle(h.x-.07,h.y-.08,.15,'#020409');}
 ctx.shadowColor='#66f6bd';ctx.shadowBlur=16;circle(exit.x,exit.y,.34,'#61e5b6');ctx.shadowBlur=0;circle(exit.x,exit.y,.22,'#193f3f');ctx.strokeStyle='#b6ffe4';ctx.lineWidth=.05;ctx.beginPath();ctx.moveTo(exit.x-.10,exit.y);ctx.lineTo(exit.x-.02,exit.y+.08);ctx.lineTo(exit.x+.12,exit.y-.10);ctx.stroke();
 const sinking=phase==='sinking'||(phase==='paused'&&beforePause==='sinking'),t=sinking?Math.min(1,sink/.55):0,bx=sinking?ball.x+(sinkAt.x-ball.x)*t:ball.x,by=sinking?ball.y+(sinkAt.y-ball.y)*t:ball.y;
 ctx.globalAlpha=1-t;ctx.shadowColor='#7eeadf';ctx.shadowBlur=12;const grad=ctx.createRadialGradient(bx-.06,by-.07,.01,bx,by,R);grad.addColorStop(0,'#fff');grad.addColorStop(.35,'#c9fff4');grad.addColorStop(1,'#48b6bd');circle(bx,by,R*(1-t),grad);ctx.restore();
 // Direction cue remains visible when later mazes exceed the screen.
 if(size>viewW||size>viewH){const angle=Math.atan2(exit.y-ball.y,exit.x-ball.x);ctx.save();ctx.translate(width-24,23);ctx.rotate(angle);ctx.fillStyle='#79e8ca';ctx.beginPath();ctx.moveTo(8,0);ctx.lineTo(-5,-5);ctx.lineTo(-5,5);ctx.closePath();ctx.fill();ctx.restore();}}
function frame(now){if(document.hidden){lastFrame=0;return;}const dt=lastFrame?Math.min((now-lastFrame)/1000,.1):0;lastFrame=now;if(phase==='playing'||phase==='sinking'){accumulator+=dt;while(accumulator>=1/120&&(phase==='playing'||phase==='sinking')){physics(1/120);accumulator-=1/120;}$('time').textContent=time(elapsed);}draw();raf=requestAnimationFrame(frame);}
const stick=$('joystick');function stickMove(e){const r=stick.getBoundingClientRect(),radius=r.width*.31,dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,len=Math.hypot(dx,dy),ratio=len>radius?radius/len:1;joystick={x:dx*ratio/radius,y:dy*ratio/radius};$('knob').style.transform=`translate(${dx*ratio}px,${dy*ratio}px)`;}
stick.addEventListener('pointerdown',e=>{if(phase!=='playing'&&phase!=='sinking')return;if(pointer!==null)return;pointer=e.pointerId;stick.setPointerCapture(pointer);stickMove(e);});stick.addEventListener('pointermove',e=>{if(e.pointerId===pointer)stickMove(e);});for(const type of ['pointerup','pointercancel','lostpointercapture'])stick.addEventListener(type,e=>{if(e.pointerId===pointer)clearInput();});
window.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright','w','a','s','d'].includes(k)){e.preventDefault();if(phase==='playing')keys.add(k);}if(k==='escape')pause();});window.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
$('calibrate').onclick=()=>{if(sensorSeen&&performance.now()-lastSensor<1500){neutral={...raw};filtered={x:0,y:0};ball.vx=ball.vy=0;$('hint').innerHTML='<strong>Calibrated.</strong><br>This angle is your new neutral.<br>Small tilts work best.';}else setMode('joystick');};
$('mode').onclick=()=>{if(mode==='tilt'){++attempt;clearTimeout(motionTimer);setMode('joystick');}else requestMotion();};$('pause').onclick=pause;
$('reset').onclick=()=>{pause();if(confirm('Erase all best times and unlocked levels?')){++attempt;clearTimeout(motionTimer);progress={highest:1,best:{}};save();clearInput();loadLevel(1);menu();}};
document.addEventListener('visibilitychange',()=>{if(document.hidden){pause();cancelAnimationFrame(raf);lastFrame=0;}else{cancelAnimationFrame(raf);lastFrame=0;raf=requestAnimationFrame(frame);}});window.addEventListener('pagehide',pause);window.addEventListener('blur',pause);window.addEventListener('resize',()=>{resize();autoNeutral=true;});
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});
new ResizeObserver(resize).observe(canvas);setMode('joystick');loadLevel(level);resize();menu();raf=requestAnimationFrame(frame);
</script>
</body>
</html>
