}

readProgress();save();
let level=progress.highest,world=null,grid=[],size=0,holes=[],exit={x:0,y:0},ball={x:1.5,y:1.5,vx:0,vy:0},checkpoint={x:1.5,y:1.5};

 let context=null,master,musicBus,fxBus,musicVolume,fxVolume,muffle,duck,stateGain,reverb,impulse,noiseBuffer;

 function ui(){const button=$('sound');button.textContent=settings.enabled?'🔊':'🔇';button.setAttribute('aria-label',settings.enabled?'Mute all sound':'Enable sound');button.setAttribute('aria-pressed',String(!settings.enabled));$('musicVolume').value=Math.round(settings.music*100);$('effectsVolume').value=Math.round(settings.effects*100);$('musicValue').textContent=Math.round(settings.music*100)+'%';$('effectsValue').textContent=Math.round(settings.effects*100)+'%';$('soundStatus').textContent=blocked?'No audio? Toggle sound off/on.':'';}

 musicBus=context.createGain();fxBus=context.createGain();musicVolume=context.createGain();fxVolume=context.createGain();muffle=context.createBiquadFilter();muffle.type='lowpass';muffle.Q.value=.45;duck=context.createGain();stateGain=context.createGain();stateGain.gain.value=0;

 reverb=context.createConvolver();const musicSend=context.createGain(),fxSend=context.createGain(),wet=context.createGain();musicSend.gain.value=.25;fxSend.gain.value=.18;wet.gain.value=.42;stateGain.connect(musicSend);musicSend.connect(reverb);fxVolume.connect(fxSend);fxSend.connect(reverb);reverb.connect(wet);wet.connect(master);

 else if(name==='portal'){noise(g,t,.53,.33,260,1700);const carrier=osc(g,'sine',180,t,.58),mod=osc(g,'sine',32,t,.58),depth=g.node(context.createGain()),e=envelope(g,t,.58,.10,.12);depth.gain.setValueAtTime(95,t);depth.gain.exponentialRampToValueAtTime(8,t+.58);mod.frequency.exponentialRampToValueAtTime(5,t+.58);mod.connect(depth);depth.connect(carrier.frequency);carrier.frequency.exponentialRampToValueAtTime(490,t+.23);carrier.frequency.exponentialRampToValueAtTime(95,t+.58);carrier.connect(e);e.connect(g.output);duration=.65;}

 }
 function pad(t,span){chordIndex=(chordIndex+([0,1,1,2,3][Math.floor(rand(0,5))]))%chords.length;const chord=chords[chordIndex],dark=!!world?.dark,octave=dark?-12:0,g=group('music',rand(-.20,.20)),duration=span+3;
